name: Build MobileGL for Android

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Android NDK Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK and CMake
      run: |
        sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

    - name: Build with CMake for Android (arm64-v8a)
      run: |
        mkdir -p build-android && cd build-android
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Upload compiled .so artifact
      uses: actions/upload-artifact@v4
      with:
        name: mobilegl-android-lib
        path: build-android/*.so
